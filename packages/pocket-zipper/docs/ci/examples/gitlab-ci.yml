# ---
# Beyond this file, protect the target branch and the policy or the exception
# registry has no teeth (docs/ci/gitlab.md, "Trust: protecting .pocket-zipper/**"):
#   1. Protect the branch with "Require merge requests" and "Pipelines must
#      succeed" so a failing lock blocks the merge.
#   2. Enable "Code Owner approval" on the protected branch and copy
#      examples/gitlab-CODEOWNERS to .gitlab/CODEOWNERS so changes under
#      .pocket-zipper/** require lock-owner approval.
# ---
workflow:
  rules:
    # Merge request pipelines only; the "when: never" branch stops a duplicate
    # branch pipeline from also running the lock.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

pocket-zipper:
  image: node:22
  before_script:
    - npm ci
    # The runner's shallow clone fetched only the MR ref; the target branch is
    # absent locally, so fetch it before --base can resolve it.
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  script:
    - npx pocket-zipper check --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --json pocket-zipper.json
  artifacts:
    paths:
      - pocket-zipper.json
    when: always
    expire_in: 30 days