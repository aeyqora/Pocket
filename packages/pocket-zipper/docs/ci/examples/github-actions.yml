# ---
# Beyond this file, two base-branch repo settings are required or the exception
# registry has no teeth (docs/ci/github.md, "Trust: protecting .pocket-zipper/**"):
#   1. Make the `pocket-zipper` job a REQUIRED status check — and require it for
#      both `pull_request` and `merge_group` when a merge queue is used.
#   2. Require Code Owners review over .pocket-zipper/**: copy
#      examples/github-CODEOWNERS to .github/CODEOWNERS, then enable "Require
#      review from Code Owners" and "Do not allow bypassing the above settings".
# ---
name: pocket-zipper

on:
  pull_request:
  # The merge queue reports a separate check on its temporary merge commit;
  # without this trigger the lock cannot be the required check for the queue.
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pocket-zipper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history: the --base ref must resolve
      - run: npm ci
      - name: Pocket Zipper
        run: |
          npx pocket-zipper check \
            --base origin/${{ github.base_ref || 'main' }} \
            --json pocket-zipper.json
      # Persist the evaluation record even when the check fails.
      - name: Upload Pocket Zipper evaluation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-zipper
          path: pocket-zipper.json