# ---
# Beyond this file, authorize approvers and enforce the stop (docs/ci/bitbucket.md,
# "Trust: protecting .pocket-zipper/**"):
#   1. NAME the approvers: copy examples/bitbucket-CODEOWNERS to
#      .bitbucket/CODEOWNERS and examples/bitbucket-teams.yaml to
#      .bitbucket/teams.yaml (editing the contributors). PRs touching
#      .pocket-zipper/** then auto-add every lock owner as a reviewer. This is
#      ADVISORY only — the CODEOWNERS file never blocks a merge.
#   2. ENFORCE in Bitbucket's UI — branch permissions and merge checks, which no
#      pipeline YAML can express:
#      a. Branch restrictions on the target branch: restrict write access (no
#         direct push, so changes must come through PRs) and restrict who may
#         merge via PR to the lock owners.
#      b. Merge check on the same branch: "Minimum number of successful builds
#         for the last commit with no failed builds and no in progress builds".
#      Note: hard blocking ("Prevent a merge with unresolved merge checks") is
#      a Bitbucket Premium feature; on lower tiers unmet checks warn only.
# ---
pipelines:
  pull-requests:
    '**':        # matches the source branch of every PR; fork PRs do not trigger
      - step:
          name: Pocket Zipper
          script:
            # PR pipelines merge the destination into the source, so HEAD's first
            # parent is the source, not the baseline; always force the merge-base
            # path with an explicit --base and never rely on parent order.
            - git fetch origin "$BITBUCKET_PR_DESTINATION_BRANCH"
            - npm ci
            - npx pocket-zipper check --base "origin/$BITBUCKET_PR_DESTINATION_BRANCH" --json pocket-zipper.json
          artifacts:
            # capture-on defaults to always, so this survives a failed check.
            - pocket-zipper.json